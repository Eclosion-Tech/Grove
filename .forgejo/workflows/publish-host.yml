name: Publish Host Image

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Full merged Grove source commit SHA"
        required: true
        default: "300cb86a26e0c55863bdbd8e0908d48875419f1c"

concurrency:
  group: publish-grove-host
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.CONTAINER_REGISTRY }}

jobs:
  publish:
    runs-on: synops
    steps:
      - name: Validate source revision
        env:
          GROVE_REVISION: ${{ inputs.revision }}
        run: |
          [[ "$GROVE_REVISION" =~ ^[a-f0-9]{40}$ ]] || exit 1

      - name: Checkout merged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify merged source
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish Grove host
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: GROVE_REVISION=${{ inputs.revision }}
          tags: ${{ env.REGISTRY }}/grove:${{ inputs.revision }}

      - name: Report immutable host image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "GROVE_BASE_IMAGE=${REGISTRY}/grove@${IMAGE_DIGEST}"
          echo "GROVE_BASE_IMAGE=${REGISTRY}/grove@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
