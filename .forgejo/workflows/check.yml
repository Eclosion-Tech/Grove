name: Check

# Runner: pin `runs-on: synops`, the label registered on synops-runner-1.
# `ubuntu-latest` is not registered on this forge and such jobs never start.
# Action versions are capped by the runner (forgejo-runner v6.4.0 accepts
# runs.using up to node20): keep checkout and setup-node at v4.
#
# The test suite needs a dedicated PostgreSQL. The runner has no `services:`
# support and no PostgreSQL binaries, so a step starts a disposable container
# on a loopback port and another step always removes it.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: grove-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: synops
    env:
      PG_CONTAINER: grove-check-pg-${{ github.run_id }}
      TEST_DATABASE_URL: postgres://grove:grove@127.0.0.1:54329/grove_test
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Set up Node
        uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start a disposable PostgreSQL
        run: |
          set -euo pipefail
          docker run -d --name "$PG_CONTAINER" -p 127.0.0.1:54329:5432 \
            -e POSTGRES_USER=grove -e POSTGRES_PASSWORD=grove -e POSTGRES_DB=grove_test \
            postgres:17-alpine >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec "$PG_CONTAINER" pg_isready -U grove -d grove_test >/dev/null 2>&1; then echo "PostgreSQL ready after ${attempt}s"; exit 0; fi
            sleep 1
          done
          echo "PostgreSQL did not become ready" >&2; docker logs "$PG_CONTAINER" >&2 || true; exit 1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build, test and typecheck
        run: npm run check

      - name: Remove the test database
        if: always()
        run: docker rm -f "$PG_CONTAINER" >/dev/null 2>&1 || true
